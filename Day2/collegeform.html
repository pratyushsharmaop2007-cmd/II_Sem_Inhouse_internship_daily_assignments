<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>College Admission Form</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family: Arial, sans-serif;
    }

    body{
        background: #f0f4f8;
        display:flex;
        justify-content:center;
        align-items:center;
        min-height:100vh;
    }

    .container{
        width:500px;
        background:#fff;
        padding:30px;
        border-radius:12px;
        box-shadow:0 4px 15px rgba(0,0,0,0.2);
    }

    h2{
        text-align:center;
        color:#2c3e50;
        margin-bottom:20px;
    }

    .form-group{
        margin-bottom:15px;
    }

    label{
        display:block;
        margin-bottom:6px;
        font-weight:bold;
        color:#333;
    }

    input,
    select,
    textarea{
        width:100%;
        padding:10px;
        border:1px solid #ccc;
        border-radius:6px;
        font-size:15px;
    }

    input:focus,
    select:focus,
    textarea:focus{
        outline:none;
        border-color:#3498db;
    }

    .gender{
        display:flex;
        gap:20px;
        margin-top:5px;
    }

    .gender label{
        font-weight:normal;
    }

    button{
        width:100%;
        padding:12px;
        background:#3498db;
        color:white;
        border:none;
        border-radius:6px;
        font-size:16px;
        cursor:pointer;
        transition:0.3s;
    }

    button:hover{
        background:#217dbb;
    }
</style>
</head>
<body>

<div class="container">

    <h2>College Admission Form</h2>

    <form>

        <div class="form-group">
            <label>Full Name</label>
            <input type="text" placeholder="Enter your name" required>
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" placeholder="Enter your email" required>
        </div>

        <div class="form-group">
            <label>Phone Number</label>
            <input type="tel" placeholder="Enter phone number" required>
        </div>

        <div class="form-group">
            <label>Date of Birth</label>
            <input type="date" required>
        </div>

        <div class="form-group">
            <label>Gender</label>
            <div class="gender">
                <div>
                    <input type="radio" name="gender" required> Male
                </div>
                <div>
                    <input type="radio" name="gender"> Female
                </div>
                <div>
                    <input type="radio" name="gender"> Other
                </div>
            </div>
        </div>

        <div class="form-group">
            <label>Course</label>
            <select required>
                <option value="">Select Course</option>
                <option>BCA</option>
                <option>BBA</option>
                <option>B.Tech</option>
                <option>B.Sc</option>
                <option>BA</option>
            </select>
        </div>

        <div class="form-group">
            <label>Address</label>
            <textarea rows="4" placeholder="Enter your address"></textarea>
        </div>

        <button type="submit">Submit Application</button>

    </form>

</div>

</body>
</html>
